openapi: 3.0.3
info:
  title: Startpage API
  version: 0.1.0
paths:
  /api/me:
    get:
      operationId: getMe
      summary: The signed-in User
      responses:
        "200":
          description: The signed-in User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing, expired or revoked Session
  /auth/logout:
    post:
      operationId: logout
      summary: End the current Session
      responses:
        "200":
          description: Session ended; navigate to redirectUrl to finish signing out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logout"
  /api/startpage:
    get:
      operationId: getStartpage
      summary: The signed-in User's Groups, each with its live Apps, in order
      responses:
        "200":
          description: The Startpage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Startpage"
        "401":
          description: Missing, expired or revoked Session
  /api/apps:
    post:
      operationId: createApp
      summary: Add an App to a Group (default the first Group), appended at the end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApp"
      responses:
        "201":
          description: The created App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          description: Name or URL missing
        "401":
          description: Missing, expired or revoked Session
        "404":
          description: The Group does not exist or belongs to another User
  /api/apps/{id}:
    put:
      operationId: updateApp
      summary: Replace an App's name, URL and icon, keeping its Group and position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppFields"
      responses:
        "200":
          description: The updated App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          description: Name or URL missing
        "401":
          description: Missing, expired or revoked Session
        "404":
          description: The App does not exist, is deleted, or belongs to another User
    delete:
      operationId: deleteApp
      summary: Soft-delete an App, keeping its Group and position so it can be restored
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The App is deleted
        "401":
          description: Missing, expired or revoked Session
        "404":
          description: The App does not exist, is already deleted, or belongs to another User
  /api/apps/{id}/restore:
    post:
      operationId: restoreApp
      summary: Restore a deleted App to its original Group and position, shifting siblings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The restored App
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "401":
          description: Missing, expired or revoked Session
        "404":
          description: The App does not exist, is not deleted, or belongs to another User
  /api/groups:
    post:
      operationId: createGroup
      summary: Add an empty tiles Group, appended at the end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewGroup"
      responses:
        "201":
          description: The created Group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Invalid body
        "401":
          description: Missing, expired or revoked Session
  /api/groups/{id}:
    patch:
      operationId: updateGroup
      summary: Update a Group's name, style and/or collapsed state; at least one field is required
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "204":
          description: Updated
        "400":
          description: Invalid id or body
        "401":
          description: Missing, expired or revoked Session
        "404":
          description: The Group does not exist or belongs to another User
components:
  schemas:
    App:
      type: object
      required: [id, name, url, iconName, iconSvg]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
          description: Stored as entered; may lack a scheme
        iconName:
          type: string
          description: Iconify icon name, e.g. simple-icons:plex
        iconSvg:
          type: string
          description: The icon's SVG body, rendered without calling Iconify
    NewApp:
      type: object
      required: [name, url]
      properties:
        groupId:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
        iconName:
          type: string
        iconSvg:
          type: string
    AppFields:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
        iconName:
          type: string
        iconSvg:
          type: string
    Group:
      type: object
      required: [id, name, style, collapsed, apps]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Empty for the unlabelled first Group
        style:
          type: string
          enum: [tiles, compact]
        collapsed:
          type: boolean
        apps:
          type: array
          items:
            $ref: "#/components/schemas/App"
    NewGroup:
      type: object
      properties:
        name:
          type: string
    GroupUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        style:
          type: string
          enum: [tiles, compact]
        collapsed:
          type: boolean
    Startpage:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    Logout:
      type: object
      required: [redirectUrl]
      properties:
        redirectUrl:
          type: string
    Me:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
