services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: startpage
      POSTGRES_PASSWORD: startpage
      POSTGRES_DB: startpage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startpage"]
      interval: 2s
      timeout: 3s
      retries: 15

  startpage:
    build: .
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: postgres://startpage:startpage@postgres:5432/startpage?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?see README}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?see README}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?see README}
    depends_on:
      postgres:
        condition: service_healthy
