<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startpage</title>
    <script>
      try {
        var vars = JSON.parse(localStorage.getItem("%THEME_CACHE_KEY%") || "null");
        if (vars) for (var name in vars) document.documentElement.style.setProperty(name, vars[name]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
